# Correction de l'atelier : la pile complète en une seule commande.
#
#   docker compose up -d      # démarrer
#   docker compose down       # arrêter et supprimer
#
# Chaque service reprend à l'identique la commande `docker run` du README.

# `network_mode: bridge` place les conteneurs sur le réseau Docker par défaut,
# comme le fait `docker run`. Sans cela, Compose crée un réseau dédié, sur
# lequel les conteneurs ne parviennent pas à se joindre dans un Codespace.
x-reseau: &reseau
  network_mode: bridge

# Équivalent de `--add-host=host.docker.internal:host-gateway`.
x-acces-hote: &acces-hote
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web1:
    <<: *reseau
    image: quay.io/ocp-edge-qe/httpd
    container_name: web1
    ports:
      - "80:80"

  web2:
    <<: *reseau
    image: quay.io/ocp-edge-qe/httpd
    container_name: web2
    ports:
      - "81:80"

  web3:
    <<: *reseau
    image: quay.io/ocp-edge-qe/httpd
    container_name: web3
    ports:
      - "82:80"

  cadvisor:
    <<: *reseau
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    <<: [*reseau, *acces-hote]
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor

  grafana:
    <<: [*reseau, *acces-hote]
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
